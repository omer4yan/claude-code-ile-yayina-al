<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Öğrenme Yolculuğum — Orvena</title>
  <meta name="robots" content="noindex">
  <meta http-equiv="refresh" content="0; url=ders.html">
  <link rel="icon" href="assets/img/favicon-32.png" sizes="32x32" type="image/png">
  <script>
    /* Eski Öğrenme Yolculuğum adresleri ders sayfalarına yönlenir:
       #m3-d2 -> ders.html?id=m3-d2, #m3 -> ders.html?id=m3-d1, #yayin-gunu -> ders.html?id=yayin-gunu */
    (function () {
      var h = decodeURIComponent(location.hash.slice(1));
      var id = /^m\d-d\d$/.test(h) ? h : /^m\d$/.test(h) ? h + "-d1" : h === "yayin-gunu" ? h : "";
      location.replace("ders.html" + (id ? "?id=" + id : ""));
    })();
  </script>
  <style>body{margin:0;font-family:system-ui,sans-serif;background:#131211;color:#f2eee7;display:grid;place-items:center;min-height:100vh}a{color:#e8622c}</style>
</head>
<body>
  <p>Bu sayfa ders sayfalarına taşındı. <a href="ders.html">Derslere git</a></p>
</body>
</html>
